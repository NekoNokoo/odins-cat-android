name: Windows EXE test artifact

on:
  push:
  workflow_dispatch:

jobs:
  build-windows-exe:
    name: Build raw Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: core/go/go.sum

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Windows test EXE
        run: npm run windows:test-exe:build

      - name: Upload Windows test EXE
        uses: actions/upload-artifact@v4
        with:
          name: odins-cat-halo-windows-exe-test
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/odin-one-desktop.exe
            apps/desktop/src-tauri/bin/mvpd.exe
