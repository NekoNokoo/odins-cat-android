def mirror = "http://127.0.0.1:4873"

def remapRepo = { repo ->
  if (!repo.hasProperty("url") || repo.url == null) {
    return
  }

  def current = repo.url.toString()
  def mapped = null

  if (current.startsWith("https://repo.maven.apache.org/maven2") || current.startsWith("https://repo1.maven.org/maven2")) {
    mapped = "${mirror}/maven2"
  } else if (current.startsWith("https://dl.google.com/dl/android/maven2")) {
    mapped = "${mirror}/google"
  } else if (current.startsWith("https://plugins.gradle.org/m2")) {
    mapped = "${mirror}/plugins"
  }

  if (mapped != null) {
    repo.setUrl(mapped)
    repo.allowInsecureProtocol = true
    println("Remapped Gradle repo ${current} -> ${mapped}")
  }
}

settingsEvaluated { settings ->
  settings.pluginManagement.repositories.each(remapRepo)
  settings.dependencyResolutionManagement.repositories.each(remapRepo)
}

allprojects {
  buildscript.repositories.each(remapRepo)
  repositories.each(remapRepo)
}
