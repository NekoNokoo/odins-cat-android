[package]
name = "odin-one-desktop"
version = "0.1.1"
description = "Odin One desktop shell"
authors = ["Odin One"]
license = ""
repository = ""
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.2", features = [] }

[dependencies]
tauri = { version = "2.8.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
getrandom = "0.2"
russh = { version = "0.58.1", default-features = false, features = ["ring"] }
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
